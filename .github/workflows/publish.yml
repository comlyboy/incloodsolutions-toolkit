name: Publish library to npm

on:
  push:
    branches:
      - publish-toolkit
      - publish-node
      - publish-react
      # - publish-angular
      - publish-devkit

jobs:
  publish-library:
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: ""
      LOCAL_VERSION: ""
      PUBLISHED_VERSION: ""
      WORKING_DIRECTORY: ${{ github.ref_name }}

    steps:
      - name: Checkout code (make repo branch code available in this pipeline)
        uses: actions/checkout@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets._NPM_TOKEN }}

      - name: Determine working directory
        run: |
          echo "WORKING_DIRECTORY=${GITHUB_REF_NAME#publish-}" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "** Installing dependencies... **"
          pwd
          npm i

      - name: Resolve package info
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          PACKAGE_NAME=$(node -p 'require("./package.json").name')
          LOCAL_VERSION=$(node -p 'require("./package.json").version')

          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "LOCAL_VERSION=$LOCAL_VERSION" >> "$GITHUB_ENV"

          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || true)

          if [ -z "$PUBLISHED_VERSION" ]; then
            PUBLISHED_VERSION="not-published"
          fi

          echo "PUBLISHED_VERSION=$PUBLISHED_VERSION" >> "$GITHUB_ENV"

      - name: Prevent duplicate publish
        run: |
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "❌ Version already exists on npm ($LOCAL_VERSION)"
            exit 1
          else
            echo "✅ New version detected. Proceeding to publish."
            echo "Local: $PACKAGE_NAME@$LOCAL_VERSION vs Published: $PUBLISHED_VERSION"
          fi

      - name: Install dependencies
        run: |
          echo "** Installing dependencies... **"
          pwd
          npm i

      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run build

      - name: Publish to npm
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm publish --access=public
